# shop dev-target config. Start shop first:
#   docker compose -f ../sast-engine/benchmarks/shop/docker-compose.yml up -d --build

target: "http://127.0.0.1:8088"
allowlist:
  - "localhost"
  - "127.0.0.1"

deadline_seconds: 480
report_reserve_seconds: 15
start_rps: 25
floor_rps: 5
verify_tls: false
max_pages: 200
probe_concurrency: 4    # points probed at once; the rate limiter still bounds requests per second

active_backend: python

route_map_path: null
hints_path: null
output_path: "output/shop_results.json"

auth:
  enabled: false

# shop's logout.php only destroys the session and redirects, which is also where its open-redirect
# bug lives (the key expects it tested). Nothing else in shop changes state beyond rows in its own
# SQLite file, so only setup/reset/delete stay denylisted.
denylist:
  - "setup"
  - "reset"
  - "delete"
