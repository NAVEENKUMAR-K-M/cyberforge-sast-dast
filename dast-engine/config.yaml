# Generic default config. Copy/override per target (see dvwa.yaml).

target: "http://localhost:8080"
allowlist:
  - "localhost"
  - "127.0.0.1"

deadline_seconds: 480
report_reserve_seconds: 15
start_rps: 25
floor_rps: 5
verify_tls: false
max_pages: 200
probe_concurrency: 4    # points probed at once; the rate limiter still bounds requests per second

active_backend: python   # python (default, custom probes) | zap | nuclei | none
zap_api_url: "http://localhost:8090"
# Only needed when the ZAP daemon runs in its own container/host and can't
# reach `target` directly (e.g. "localhost" inside a Docker container means
# that container, not the target). Leave null when ZAP can reach `target`
# as-is. See scanners/zap_runner.py's module docstring.
zap_scan_target: null

route_map_path: null   # optional, from SAST: route_map.json
hints_path: null       # optional, from SAST: hints.json
output_path: "output/dast_results.json"

auth:
  enabled: false
  login_url: ""
  username_field: "username"
  password_field: "password"
  username: ""
  password: ""
  extra_fields: {}
  success_indicator: null

denylist:
  - "logout"
  - "setup"
  - "reset"
  - "delete"
