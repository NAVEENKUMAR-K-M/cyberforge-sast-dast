# Reflected/stored XSS probe (CWE-79). A single unique marker per request
# lets the probe classify exactly where/how it landed in the response
# (HTML body, attribute, script, URL) without needing a real <script> to
# fire -- execution is only confirmed later, optionally, via the headless
# browser verifier.
#
# {marker} is substituted with a fresh random token per injection point so
# a hit can never be confused with another request's payload or with
# page content that already happens to look similar.

# Each template must contain at least one HTML-significant character
# (<, >, ", ') so that verbatim survival in the response actually proves
# something -- a bare alphanumeric marker would "survive" even through
# correct HTML-escaping and say nothing about exploitability.
marker_payloads:
  - "<{marker}>"
  - "\"{marker}\""
  - "'{marker}'"
  - "{marker}\"'><"
  # Attribute event-handler breakout: the single most common real-world
  # attribute-context XSS -- break out of the current attribute's quote
  # and add a whole new attribute, no closing ">" needed. Both quote
  # styles since apps use either convention.
  - "\" onmouseover=\"{marker}"
  - "' onmouseover='{marker}"
  # A realistic tag-based payload (vs. the bare, nameless "<marker>"
  # above) -- more convincing evidence, same verbatim-survival check.
  - "'><svg onload={marker}>"

# Tried only where the marker already reflected and nothing above fired. HTML-escaping leaves a space and an
# equals sign alone, so when the value lands in an attribute with no quotes (<img src=VALUE>) this adds a new
# attribute. Judged only when the text right before it is `name=`, since inside quotes it is inert.
unquoted_attribute_payload: "{marker} onmouseover={marker}"
