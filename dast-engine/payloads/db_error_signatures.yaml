# Database error-message signatures used to confirm error-based SQLi.
# A bare 500 status is NEVER sufficient on its own (a decoy int-cast param
# can 500 on bad input without being injectable) -- one of these strings
# must actually appear in the response body.

# A bare exception/class *name* (mysqli_sql_exception, sqlite3.OperationalError,
# ...) is NOT used alone: confirmed in testing against live DVWA that its
# own setup documentation mentions "mysqli_sql_exception" in prose (about
# PHP 8.1 compatibility) with no error involved at all. Real thrown errors
# are reliably printed as "Uncaught <ClassName>" or "<ClassName>: <message>",
# so requiring that shape keeps the specific, low-false-positive phrases
# while still matching genuine stack traces.

mysql:
  - "you have an error in your sql syntax"
  - "warning: mysql_"
  - "uncaught mysqli_sql_exception"
  - "unknown column"
  - "supplied argument is not a valid mysql"
  - "pymysql.err."
  - "mysql.connector.errors."
  - "mysqldb.exceptions."
  - "error 1064 (42000)"

postgresql:
  - "pg_query(): query failed"
  - "pg_exec(): query failed"
  - "unterminated quoted string at or near"
  - "syntax error at or near"
  - "psycopg2.errors."
  - "psycopg2.operationalerror"
  - "psycopg2.programmingerror"
  - "psycopg.errors."
  - "invalid input syntax for"
  - "org.postgresql.util.psqlexception:"

sqlite:
  - "sqlite3.operationalerror:"
  - "sqlite_error"
  - "near \"\": syntax error"
  # SQLite names the token it stopped at, and the token is whatever followed the quote.
  - 're:near (?:"|&quot;|&#039;)[^"&<]{0,80}(?:"|&quot;|&#039;): syntax error'
  - "unterminated string literal"
  - "unrecognized token"
  - "sqlite3.programmingerror"
  - "no such column:"
  - "no such table:"
  - "sqlite3.integrityerror:"
  - "(sqlite3.operationalerror)"

mssql:
  - "unclosed quotation mark after the character string"
  - "microsoft ole db provider for sql server"
  - "incorrect syntax near"
  - "system.data.sqlclient.sqlexception:"

oracle:
  - "ora-00933"
  - "ora-01756"
  - "ora-00936"
  - "quoted string not properly terminated"

# Python data layers. These appear on debug pages and in logged tracebacks that an app leaks, and a
# SQLAlchemy or Django error carries the driver's own message, so they confirm without the driver text.
python:
  - "sqlalchemy.exc."
  - "django.db.utils."
  - "django.db.utils.operationalerror"
  - "peewee.operationalerror"
  - "asyncpg.exceptions."
  - "tortoise.exceptions."

# What other stacks print when a query breaks. The database driver's own words are matched above; these
# are the wrappers around them, which an app shows even when it rewrites the driver message.
wrappers:
  - "uncaught pdoexception"
  - "sqlstate["
  - "pdostatement::execute"
  - "java.sql.sqlsyntaxerrorexception"
  - "java.sql.sqlexception"
  - "org.hibernate.exception.sqlgrammarexception"
  - "sequelizedatabaseerror"
  - "activerecord::statementinvalid"
  - "pg::syntaxerror"
  - "pq: syntax error"
  - "syntax error at or near"
